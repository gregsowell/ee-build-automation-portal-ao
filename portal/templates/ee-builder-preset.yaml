---
# Red Hat's 'start from scratch' execution environment template with the
# publishing target filled in, so the builder opens on the right repository
# instead of asking for it every time.
#
# Replace every CHANGEME_ value, put the file
# somewhere the portal can read, and register it under catalog.locations.
# See portal/README.md.
#
# The person ordering never touches source control. The publishing target is
# not a form field at all: it is written into the steps below, in place of Red
# Hat's ScmSelector, which looks up namespaces from the browser and asks every
# user to sign in to the forge. The publish steps carry no token, so they run
# with the portal's own integrations.<forge> token, and the merge request
# records who asked for it. The forge build option (GitHub Actions, GitLab
# pipeline) is gone too: merging is what builds.
#
# Derived from ansible/ansible-rhdh-templates v2.0.1.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ansible-execution-environment-builder-preset
  title: Execution Environment (preset repository)
  description: Build an execution environment definition and publish it to the repository this build chain
    watches. Red Hat's template with the publishing target filled in.
  tags:
  - ansible
  - execution-environment
  - automation
  - start-from-scratch
  - preset
spec:
  type: execution-environment
  parameters:
  - title: Base Image
    description: Configure the base image for your execution environment
    properties:
      baseImage:
        title: Base execution environment image
        type: string
        default: registry.redhat.io/ansible-automation-platform/ee-minimal-rhel8:2.18
        enum:
        - registry.redhat.io/ansible-automation-platform/ee-minimal-rhel8:2.18
        - registry.redhat.io/ansible-automation-platform/ee-minimal-rhel9:2.18
        - registry.redhat.io/ansible-automation-platform/ee-minimal-rhel8:2.16
        - registry.redhat.io/ansible-automation-platform/ee-minimal-rhel9:2.16
        - custom
        enumNames:
        - Red Hat Ansible Minimal EE - Ansible Core 2.18 (RHEL 8)
        - Red Hat Ansible Minimal EE - Ansible Core 2.18 (RHEL 9)
        - Red Hat Ansible Minimal EE - Ansible Core 2.16 (RHEL 8)
        - Red Hat Ansible Minimal EE - Ansible Core 2.16 (RHEL 9)
        - Custom Image
        ui:field: BaseImagePicker
    dependencies:
      baseImage:
        oneOf:
        - properties:
            baseImage:
              const: custom
            customBaseImage:
              title: Custom Base Image
              type: string
              description: Enter a custom execution environment base image
              ui:
                field: EntityNamePicker
                options: null
                allowArbitraryValues: true
                help: 'Format: [registry[:port]/][namespace/]name[:tag]'
                placeholder: e.g., quay.io/org/custom-ee:latest
          required:
          - customBaseImage
        - properties:
            baseImage:
              not:
                const: custom
  - title: Configuration
    description: Add collections to be included in your execution environment definition file (optional).
    properties:
      collections:
        title: Collections
        type: array
        description: Add collections to be included in your execution environment definition file (optional).
        ui:field: CollectionsPicker
      advancedConfiguration:
        title: Advanced Configuration
        type: object
        ui:order:
        - specifyRequirements
        - pythonRequirements
        - pythonRequirementsFile
        - systemPackages
        - systemPackagesFile
        - addBuildSteps
        - additionalBuildSteps
        - '*'
        properties:
          specifyRequirements:
            title: Customize additional Python requirements and System packages
            type: boolean
            default: false
            ui:help: Check this box to define additional Python or system dependencies to include in your
              EE.
          addBuildSteps:
            title: Include additional build steps
            type: boolean
            default: false
            ui:help: Check this box to add custom build steps that will be executed at specific points
              during the build process. These map to ansible-builder's additional_build_steps configuration
              (optional step).
        dependencies:
          specifyRequirements:
            oneOf:
            - properties:
                specifyRequirements:
                  const: true
                pythonRequirements:
                  title: Additional Python Requirements
                  type: array
                  description: 'Specify additional python packages that are required in addition to what
                    the selected collections already specify as dependencies.

                    Packages already specified in the collections as a dependency should not be repeated
                    here.

                    '
                  items:
                    type: string
                    title: Python package
                    description: Python package (with optional version specification)
                    ui:placeholder: e.g., requests>=2.28.0
                  ui:field: PackagesPicker
                pythonRequirementsFile:
                  type: string
                  format: data-url
                  title: Pick a file with Python requirements
                  description: Upload a requirements.txt file with python package details
                  ui:field: FileUploadPicker
                  ui:placeholder: Paste the full content of your requirements.txt file here. Alternatively,
                    upload a file. Please verify formatting, as no syntax validation is applied.
                  ui:buttonText: Choose file
                systemPackages:
                  title: Additional System Packages
                  type: array
                  description: 'Specify additional system-level packages that are required in addition
                    to what the selected collections already specify as dependencies.

                    Packages already specified in the collections as a dependency should not be repeated
                    here.

                    '
                  items:
                    type: string
                    title: System package
                    description: System package
                    ui:placeholder: e.g., libxml2-dev [platform:dpkg], libssh-devel [platform:rpm]
                  ui:field: PackagesPicker
                systemPackagesFile:
                  type: string
                  format: data-url
                  title: Add system packages
                  description: Upload a bindep.txt file with system package details
                  ui:field: FileUploadPicker
                  ui:placeholder: Paste the full content of your bindep.txt file here. Alternatively,
                    upload a file. Please verify formatting, as no syntax validation is applied.
                  ui:buttonText: Choose file
            - properties:
                specifyRequirements:
                  const: false
          addBuildSteps:
            oneOf:
            - properties:
                addBuildSteps:
                  const: true
                additionalBuildSteps:
                  title: Additional Build Steps
                  type: array
                  description: Add custom build steps that will be executed at specific points during
                    the build process. These map to ansible-builder's additional_build_steps configuration.
                  items:
                    type: object
                    properties:
                      stepType:
                        title: Step Type
                        type: string
                        description: When this build step should execute
                        enum:
                        - prepend_base
                        - append_base
                        - prepend_galaxy
                        - append_galaxy
                        - prepend_builder
                        - append_builder
                        - prepend_final
                        - append_final
                        enumNames:
                        - Prepend Base - Before base image dependencies
                        - Append Base - After base image dependencies
                        - Prepend Galaxy - Before Ansible collections
                        - Append Galaxy - After Ansible collections
                        - Prepend Builder - Before main build steps
                        - Append Builder - After main build steps
                        - Prepend Final - Before final image steps
                        - Append Final - After final image steps
                        default: prepend_base
                      commands:
                        title: Commands
                        type: array
                        description: List of commands to execute
                        items:
                          type: string
                    required:
                    - stepType
                    - commands
                  ui:field: AdditionalBuildStepsPicker
            - properties:
                addBuildSteps:
                  const: false
  - title: Destination and Build
    description: Generate and publish the EE definition file and template.
    properties:
      eeFileName:
        title: EE Definition Name
        type: string
        ui:field: EEFileNamePicker
        ui:help: Specify a name for the Execution Environment definition. This will also be used as the
          name of the EE definition file.
      templateDescription:
        title: Description
        type: string
        description: 'Description for the generated Execution Environment definition.

          This description is used when displaying the Execution Environment definition in the catalog.

          Additionally, this description is also used in the Software Template that is generated with
          Git-based publishing.

          '
      tags:
        title: Tags
        description: 'Add tags to make this EE definition discoverable in the catalog. Tags must be 63
          characters or less and can only contain lowercase letters, numbers, and hyphens.

          The default execution-environment tag identifies this as an EE component; keeping it is highly
          recommended.

          '
        type: array
        default:
        - execution-environment
        items:
          type: string
        ui:
          field: EETagsPicker
          options:
            addable: true
            orderable: true
            removable: true
          help: Add one or more tags for the generated template.
      publishAndBuild:
        title: Publish and Build
        description: The definition is published to CHANGEME_SCM_OWNER/CHANGEME_DEFINITIONS_REPO, and the
          image is built and added to the platform automatically.
        type: object
        properties:
          publishToSCM:
            title: Publish and build
            type: boolean
            default: true
            ui:help: If unchecked, nothing is published or built, and you get a link to download the
              generated files instead.
    required:
    - eeFileName
    - templateDescription
  steps:
  - id: create-ee-definition
    name: Create Execution Environment Definition
    action: ansible:create:ee-definition
    input:
      values:
        eeFileName: ${{ parameters.eeFileName }}
        eeDescription: ${{ parameters.templateDescription }}
        tags: ${{ parameters.tags or [] }}
        publishToSCM: ${{ parameters.publishAndBuild.publishToSCM }}
        baseImage: ${{ parameters.baseImage === 'custom' and parameters.customBaseImage or parameters.baseImage
          }}
        customBaseImage: ${{ parameters.customBaseImage or '' }}
        collections: ${{ parameters.collections or [] }}
        pythonRequirements: ${{ parameters.advancedConfiguration.pythonRequirements or [] }}
        pythonRequirementsFile: ${{ parameters.advancedConfiguration.pythonRequirementsFile or '' }}
        systemPackages: ${{ parameters.advancedConfiguration.systemPackages or [] }}
        systemPackagesFile: ${{ parameters.advancedConfiguration.systemPackagesFile or '' }}
        additionalBuildSteps: ${{ parameters.advancedConfiguration.additionalBuildSteps or [] }}
        buildRegistry: ${{ parameters.publishAndBuild.buildRegistry === 'Custom Registry' and parameters.publishAndBuild.customRegistryUrl
          or parameters.publishAndBuild.buildRegistry or '' }}
        buildImageName: ${{ parameters.publishAndBuild.buildImageName or '' }}
        buildImageTag: ${{ parameters.publishAndBuild.buildImageTag or '' }}
        registryTlsVerify: ${{ parameters.publishAndBuild.registryTlsVerify }}
        scmProvider: ${{ 'CHANGEME_SCM_PROVIDER' or 'github' }}
  - id: prepare-publish
    action: ansible:prepare:publish
    name: Prepare for publishing
    # GitHub only. The portal's ansible:prepare:publish (plugin 2.2.7) never
    # passes a host to its SCM client, so for GitLab it always asks gitlab.com
    # and fails on a self-hosted instance ("Repository ... does not exist").
    # The GitLab steps below build the same values from the form and the host
    # this template names.
    if: ${{ parameters.publishAndBuild.publishToSCM and 'CHANGEME_SCM_PROVIDER' == 'github' }}
    input:
      sourceControlProvider: ${{ 'CHANGEME_SCM_PROVIDER' }}
      repositoryOwner: ${{ 'CHANGEME_SCM_OWNER' }}
      repositoryName: ${{ 'CHANGEME_DEFINITIONS_REPO' }}
      createNewRepository: ${{ not true }}
      eeFileName: ${{ parameters.eeFileName }}
      contextDirName: ${{ steps['create-ee-definition'].output.contextDirName }}
  - id: create-catalog-info-file
    action: catalog:write
    if: ${{ parameters.publishAndBuild.publishToSCM }}
    name: Create catalog component file for the EE Definition
    input:
      filePath: ${{ steps['create-ee-definition'].output.catalogInfoPath }}
      entity:
        apiVersion: backstage.io/v1alpha1
        kind: Component
        metadata:
          name: ${{ parameters.eeFileName }}
          description: ${{ parameters.templateDescription }}
          tags: ${{ parameters.tags or [] }}
          annotations:
            backstage.io/techdocs-ref: dir:.
            backstage.io/managed-by-location: ${{ steps['prepare-publish'].output.generatedRepoUrl if 'CHANGEME_SCM_PROVIDER' == 'github' else ('CHANGEME_SCM_HOST?repo=' ~ 'CHANGEME_DEFINITIONS_REPO' ~ '&owner=' ~ 'CHANGEME_SCM_OWNER') }}
            ansible.io/scm-provider: ${{ 'CHANGEME_SCM_PROVIDER' }}
        spec:
          type: execution-environment
          owner: ${{ steps['create-ee-definition'].output.owner }}
          lifecycle: production
  - id: publish-github
    name: Create and publish to a new GitHub Repository
    action: publish:github
    if: ${{ (parameters.publishAndBuild.publishToSCM) and (not true)
      and ('CHANGEME_SCM_PROVIDER' == 'github') }}
    input:
      description: ${{ parameters.templateDescription }}
      repoUrl: ${{ steps['prepare-publish'].output.generatedRepoUrl }}
      defaultBranch: main
      repoVisibility: public
  - id: publish-gitlab
    name: Create and publish to a new GitLab Repository
    action: publish:gitlab
    if: ${{ (parameters.publishAndBuild.publishToSCM) and (not true)
      and ('CHANGEME_SCM_PROVIDER' == 'gitlab') }}
    input:
      repoUrl: CHANGEME_SCM_HOST?repo=${{ 'CHANGEME_DEFINITIONS_REPO' }}&owner=${{ 'CHANGEME_SCM_OWNER' }}
      defaultBranch: main
      repoVisibility: public
  - id: publish-github-pull-request
    name: Publish generated files as a Github Pull Request
    action: publish:github:pull-request
    if: ${{ parameters.publishAndBuild.publishToSCM and (true)
      and ('CHANGEME_SCM_PROVIDER' == 'github') }}
    input:
      repoUrl: ${{ steps['prepare-publish'].output.generatedRepoUrl }}
      branchName: ${{ steps['prepare-publish'].output.generatedBranchName }}
      title: ${{ steps['prepare-publish'].output.generatedTitle }}
      description: ${{ steps['prepare-publish'].output.generatedDescription }}
  - id: publish-gitlab-merge-request
    name: Publish generated files as a Gitlab Merge Request
    action: publish:gitlab:merge-request
    if: ${{ parameters.publishAndBuild.publishToSCM and (true)
      and ('CHANGEME_SCM_PROVIDER' == 'gitlab') }}
    input:
      repoUrl: CHANGEME_SCM_HOST?repo=${{ 'CHANGEME_DEFINITIONS_REPO' }}&owner=${{ 'CHANGEME_SCM_OWNER' }}
      branchName: portal-${{ parameters.eeFileName | lower }}
      title: '[AAP] Adds/updates files for Execution Environment ${{ parameters.eeFileName }}'
      description: Execution Environment files generated by the Ansible automation portal for ${{ user.ref or 'an unknown user' }}.
  - id: register-catalog-component
    name: Register published EE as a Catalog Component
    action: catalog:register
    if: ${{ parameters.publishAndBuild.publishToSCM }}
    input:
      catalogInfoUrl: ${{ steps['prepare-publish'].output.generatedCatalogInfoUrl if 'CHANGEME_SCM_PROVIDER' == 'github' else (('https://CHANGEME_SCM_HOST/' ~ 'CHANGEME_SCM_OWNER' ~ '/' ~ 'CHANGEME_DEFINITIONS_REPO') ~ '/-/blob/main/' ~ steps['create-ee-definition'].output.contextDirName ~ '/catalog-info.yaml') }}
      optional: true
  - id: dispatch-ee-build
    action: github:actions:dispatch
    name: Start EE Build Workflow
    if: ${{ parameters.publishAndBuild.buildExecutionEnvironment and 'CHANGEME_SCM_PROVIDER'
      == 'github' }}
    input:
      repoUrl: ${{ steps['prepare-publish'].output.generatedRepoUrl }}
      workflowId: ee-build.yml
      branchOrTagName: ${{ steps['prepare-publish'].output.generatedBranchName or 'main' }}
      workflowInputs:
        ee_image_build_tag: ${{ parameters.publishAndBuild.buildImageTag or '' }}
  # No GitLab pipeline trigger: this chain builds when the merge request is
  # merged, through the EDA rule on the project's webhook, and the GitLab
  # instance runs no CI.
  output:
    text:
    - title: Getting Started
      content: '${{ steps[''create-ee-definition''].output.readmeContent }}

        '
    links:
    - title: ${{ 'CHANGEME_SCM_LABEL' }} Repository
      url: ${{ steps['prepare-publish'].output.generatedFullRepoUrl if 'CHANGEME_SCM_PROVIDER' == 'github' else ('https://CHANGEME_SCM_HOST/' ~ 'CHANGEME_SCM_OWNER' ~ '/' ~ 'CHANGEME_DEFINITIONS_REPO') }}
      if: ${{ (parameters.publishAndBuild.publishToSCM) and (not true)
        }}
      icon: ${{ 'CHANGEME_SCM_PROVIDER' }}
    - title: GitHub Pull Request
      url: ${{ steps['publish-github-pull-request'].output.remoteUrl }}
      if: ${{ (parameters.publishAndBuild.publishToSCM) and (true)
        and ('CHANGEME_SCM_PROVIDER' == 'github') }}
      icon: github
    - title: ${{ 'CHANGEME_SCM_LABEL' }} EE Build Workflow Run
      url: https://${{ steps['prepare-publish'].output.normalizedRepoUrl }}/actions/workflows/ee-build.yml
      if: ${{ parameters.publishAndBuild.buildExecutionEnvironment == true and 'CHANGEME_SCM_PROVIDER'
        == 'github' }}
      icon: github
    - title: GitLab Merge Request
      url: ${{ steps['publish-gitlab-merge-request'].output.mergeRequestUrl }}
      if: ${{ (parameters.publishAndBuild.publishToSCM) and (true)
        and ('CHANGEME_SCM_PROVIDER' == 'gitlab') }}
    - title: View details in catalog
      icon: catalog
      url: ${{ steps['create-ee-definition'].output.generatedEntityRef }}
      if: ${{ not (steps['publish-github-pull-request'].output.remoteUrl or steps['publish-gitlab-merge-request'].output.mergeRequestUrl)
        }}
