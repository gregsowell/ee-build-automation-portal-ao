---
# Copy this file to secrets.yml (git-ignored) and fill it in:
#
#   cp setup/secrets.example.yml secrets.yml
#   ansible-playbook setup/configure_aap.yml -e @secrets.yml
#   ansible-playbook setup/configure_ao.yml  -e @secrets.yml
#
# Nothing in here belongs in the repository.

# --- Ansible Automation Platform -------------------------------------------
aap_url: https://aap.example.com
# Access Management > Users > (you) > Tokens, scope Write.
aap_token: CHANGEME
aap_validate_certs: false
aap_organization: Default

# --- This repository --------------------------------------------------------
ee_repo_scm_url: https://github.com/CHANGEME/ee-build-automation-portal-ao.git

# --- Build host -------------------------------------------------------------
# Inventory holding the build host, the host (or pattern) to build on, and a
# machine credential that can escalate on it.
ee_build_inventory: CHANGEME
ee_build_host_limit: ee-builder
ee_machine_credential: CHANGEME
# Inventory holding localhost, used by the notify and forward job templates.
ee_localhost_inventory: Demo Inventory
# Existing Red Hat Ansible Automation Platform credential the register playbook
# uses to add the execution environment to controller.
ee_aap_credential_name: CHANGEME

# --- Registries -------------------------------------------------------------
# Private automation hub container registry.
ee_hub_host: hub.example.com
ee_hub_username: CHANGEME
ee_hub_password: CHANGEME
# Base images. Create a registry service account at
# https://access.redhat.com/terms-based-registry/ and use its token here.
ee_base_registry_host: registry.redhat.io
ee_base_registry_username: CHANGEME
ee_base_registry_password: CHANGEME

# Private automation hub galaxy endpoint and a token for reading collections.
# Builds search these repositories before galaxy.ansible.com.
ee_galaxy_url: https://hub.example.com/api/galaxy/
# Optional: some deployments reject hub API tokens, in which case the build
# falls back to the hub account above.
ee_galaxy_token: ""go

# --- Automation orchestrator ------------------------------------------------
ao_url: https://orchestrator.example.com
# Admin password, used by configure_ao.yml only.
ao_password: CHANGEME
# Filled in from the output of configure_ao.yml, then rerun configure_aap.yml.
ao_client_id: CHANGEME
ao_client_secret: CHANGEME
ao_webhook_path: ee-definition-pushed
# Names of the AAP integration and credential already defined in the
# orchestrator, which the workflow's job steps run through.
ao_aap_integration_name: Demo AAP
ao_aap_credential_name: Demo AAP

# --- GitHub -----------------------------------------------------------------
# Shared secret between GitHub and the Event-Driven Ansible event stream.
# Generate one with: openssl rand -hex 32
github_hmac_secret: CHANGEME
# OAuth App used by the automation portal's EE builder to push as the signed-in
# user. Callback: https://<portal>/api/auth/github/handler/frame
github_oauth_client_id: CHANGEME
github_oauth_client_secret: CHANGEME
# Token the portal uses to read repositories and open pull requests.
github_token: CHANGEME
