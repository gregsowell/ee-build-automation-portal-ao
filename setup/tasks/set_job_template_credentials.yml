---
# Make a job template's credentials match a list exactly.
#
# Controller allows only one credential of a kind, and re-posting one that is
# already attached counts as a second assignment, so anything not wanted is
# detached first and only the missing ones are attached.
#
# Input:
#   jt_credentials.name         Job template name
#   jt_credentials.credentials  IDs the job template should end up with
- name: Find {{ jt_credentials.name }}
  ansible.builtin.uri:
    url: "{{ _controller_api }}/job_templates/?name={{ jt_credentials.name | urlencode }}"
    headers: "{{ _api_headers }}"
    validate_certs: "{{ aap_validate_certs }}"
  register: _jt_find

- name: Read the credentials on {{ jt_credentials.name }}
  ansible.builtin.uri:
    url: "{{ _controller_api }}/job_templates/{{ (_jt_find.json.results | first).id }}/credentials/"
    headers: "{{ _api_headers }}"
    validate_certs: "{{ aap_validate_certs }}"
  register: _jt_current

- name: Work out what to change on {{ jt_credentials.name }}
  ansible.builtin.set_fact:
    _jt_id: "{{ (_jt_find.json.results | first).id }}"
    _jt_wanted: "{{ jt_credentials.credentials | map('int') | list }}"
    _jt_attached: "{{ _jt_current.json.results | map(attribute='id') | list }}"

- name: Detach credentials that do not belong on {{ jt_credentials.name }}
  ansible.builtin.uri:
    url: "{{ _controller_api }}/job_templates/{{ _jt_id }}/credentials/"
    method: POST
    headers: "{{ _api_headers }}"
    body_format: json
    body: "{{ {'id': item | int, 'disassociate': true} }}"
    status_code: [200, 201, 204]
    validate_certs: "{{ aap_validate_certs }}"
  loop: "{{ _jt_attached | difference(_jt_wanted) }}"

- name: Attach the credentials {{ jt_credentials.name }} is missing
  ansible.builtin.uri:
    url: "{{ _controller_api }}/job_templates/{{ _jt_id }}/credentials/"
    method: POST
    headers: "{{ _api_headers }}"
    body_format: json
    body: "{{ {'id': item | int} }}"
    status_code: [200, 201, 204]
    validate_certs: "{{ aap_validate_certs }}"
  loop: "{{ _jt_wanted | difference(_jt_attached) }}"
