---
# Start an execution environment build when a definition lands on main.
#
# Rulebook activation: "EE Definition Push"
#   Decision environment: any supported DE
#   Event stream: the GitHub event stream, which replaces the source below
#   Variables: ee_forward_job_template, ee_organization (optional overrides)
#
# The webhook source here is a placeholder. When an event stream is attached to
# the activation it takes the source's place, and events arrive from GitHub with
# the payload under event.payload.
- name: Execution environment definition pushed
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Definition change on main starts a Build-EE run
      condition: >-
        event.payload.ref == "refs/heads/main" and
        event.payload.head_commit is defined and
        event.payload.head_commit.message is not search("[skip-ee-build]")
      action:
        run_job_template:
          name: "{{ ee_forward_job_template | default('EE Build | Forward Event to AO') }}"
          organization: "{{ ee_organization | default('Default') }}"
          job_args:
            extra_vars:
              ee_event: "{{ event.payload }}"

    - name: Log pushes that are skipped
      condition: >-
        event.payload.ref is defined and
        event.payload.ref != "refs/heads/main"
      action:
        debug:
          msg: "Ignoring a push to {{ event.payload.ref }}; only main starts a build."
