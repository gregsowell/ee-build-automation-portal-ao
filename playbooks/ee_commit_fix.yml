---
# Commit the agent's corrected definition back to the definitions repository,
# after a human approved it and the image was registered.
#
# Job template: "EE Build | Commit AI Fix"  (prompt on launch: extra variables)
# Inventory:    the inventory holding the build host, limited to that host
# Credentials:  a machine credential for the build host
#               + "EE Definitions Git Token"
#
# Why: without this the repository keeps a definition that is known not to
# build, while the image that shipped exists only as a tag in the hub. The next
# push re-runs the same repair and asks for the same approval again.
#
# The file is read from the build directory rather than from a job artifact,
# because that artifact is trimmed to fit the agent's prompt.
#
# Required variables
#   ee_name, ee_definition_path, ee_definition_file, ee_repo_url, ee_git_ref
# Provenance recorded in the commit message
#   ee_ai_summary, ee_ai_root_cause, ee_ai_category, ee_registered_image, ee_job_url
- name: Commit the agent's fix back to the definitions repository
  hosts: "{{ ee_build_host | default('ee-builder') }}"
  gather_facts: false

  vars:
    ee_commit_ai_fix: true
    ee_git_token: ""
    ee_git_branch: main
    ee_github_api: https://api.github.com
    ee_ai_summary: ""
    ee_ai_root_cause: ""
    ee_ai_category: ""
    ee_registered_image: ""
    ee_job_url: ""
    # The rulebook ignores commits carrying this, so writing the fix back does
    # not start another build of the definition that just built.
    ee_skip_marker: "[skip-ee-build]"

  tasks:
    - name: Check the required variables
      ansible.builtin.assert:
        that:
          - ee_name | default('', true) | length > 0
          - ee_definition_path | default('', true) | length > 0
          - ee_definition_file | default('', true) | length > 0
          - ee_repo_url | default('', true) | length > 0
        fail_msg: >-
          ee_name, ee_definition_path, ee_definition_file and ee_repo_url are
          required.

    - name: Stop when writing back is switched off
      when: not ee_commit_ai_fix | bool
      block:
        - name: Say so
          ansible.builtin.set_stats:
            aggregate: false
            per_host: false
            data:
              ee_commit_result: skipped
              ee_commit_reason: disabled

        - name: End the play
          ansible.builtin.meta: end_play

    - name: Work out which repository this is
      ansible.builtin.set_fact:
        _repo: >-
          {{ ee_repo_url | regex_replace('^https?://[^/]+/', '')
                         | regex_replace('\.git$', '') }}
        _provider: >-
          {{ 'github' if ee_repo_url is search('(^|//|@)github\.com[/:]') else 'gitlab' }}

    # GitLab takes the project and the file path URL-encoded, slashes
    # included, in place of GitHub's owner/repo plus path.
    - name: Work out the GitLab endpoints
      ansible.builtin.set_fact:
        _gl_files: >-
          {{ (ee_repo_url | regex_replace('^(https?://[^/]+).*$', '\1'))
             ~ '/api/v4/projects/'
             ~ (_repo | urlencode | regex_replace('/', '%2F'))
             ~ '/repository/files/'
             ~ (ee_definition_path | urlencode | regex_replace('/', '%2F')) }}
      when: _provider == 'gitlab'

    - name: Read the definition that was built
      ansible.builtin.slurp:
        src: "{{ ee_definition_file }}"
      register: _built

    - name: Look at the file in GitHub
      when: _provider == 'github'
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ ee_github_api }}/repos/{{ _repo }}/contents/{{ ee_definition_path }}?ref={{ item }}"
        headers:
          Authorization: "Bearer {{ ee_git_token }}"
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        status_code: [200, 404]
      loop:
        - "{{ ee_git_branch }}"
        - "{{ ee_git_ref }}"
      register: _gh
      no_log: true

    - name: Look at the file in GitLab
      when: _provider == 'gitlab'
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ _gl_files }}?ref={{ item }}"
        headers:
          PRIVATE-TOKEN: "{{ ee_git_token }}"
        status_code: [200, 404]
      loop:
        - "{{ ee_git_branch }}"
        - "{{ ee_git_ref }}"
      register: _gl
      no_log: true

    # Both forges are reduced to the same handful of facts: whether the file is
    # there, what it contains, an identifier for the blob at the branch head
    # and at the commit that was built, and whatever token the write needs to
    # prove it is not overwriting someone else's change.
    - name: Reduce GitHub's answer to the common facts
      when: _provider == 'github'
      ansible.builtin.set_fact:
        _head_status: "{{ _gh.results[0].status | int }}"
        _build_status: "{{ _gh.results[1].status | int }}"
        _head_blob: "{{ _gh.results[0].json.sha | default('') }}"
        _build_blob: "{{ _gh.results[1].json.sha | default('') }}"
        _head_content: >-
          {{ (_gh.results[0].json.content | default('') | b64decode)
             if _gh.results[0].status == 200 else '' }}
        _write_guard: "{{ _gh.results[0].json.sha | default('') }}"
      no_log: true

    - name: Reduce GitLab's answer to the common facts
      when: _provider == 'gitlab'
      ansible.builtin.set_fact:
        _head_status: "{{ _gl.results[0].status | int }}"
        _build_status: "{{ _gl.results[1].status | int }}"
        _head_blob: "{{ _gl.results[0].json.blob_id | default('') }}"
        _build_blob: "{{ _gl.results[1].json.blob_id | default('') }}"
        _head_content: >-
          {{ (_gl.results[0].json.content | default('') | b64decode)
             if _gl.results[0].status == 200 else '' }}
        # GitLab guards the write with the last commit that touched the file.
        _write_guard: "{{ _gl.results[0].json.last_commit_id | default('') }}"
      no_log: true

    - name: Note what was built
      ansible.builtin.set_fact:
        _built_content: "{{ _built.content | b64decode }}"

    # The build may have started from an older commit, or someone may have
    # edited the file since. Either way the fix is not applied blindly.
    - name: Decide whether to commit
      ansible.builtin.set_fact:
        _moved_on: >-
          {{ _head_status | int == 200 and _build_status | int == 200
             and _head_blob != _build_blob }}
        _unchanged: >-
          {{ _head_status | int == 200 and _head_content == _built_content }}
        _message: |-
          Apply the agent's fix to {{ ee_name }} {{ ee_skip_marker }}

          {{ ee_ai_summary | default('The build agent corrected this definition.', true) }}

          Root cause: {{ ee_ai_root_cause | default('not recorded', true) }}
          Category: {{ ee_ai_category | default('not recorded', true) }}
          Built and registered as: {{ ee_registered_image | default('not recorded', true) }}
          Build job: {{ ee_job_url | default('not recorded', true) }}

          Approved by a human in the Build-EE workflow before this was written
          back. The previous version is the parent of this commit.

    - name: Write the definition back to GitHub
      when:
        - _provider == 'github'
        - _head_status | int == 200
        - not _moved_on | bool
        - not _unchanged | bool
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ ee_github_api }}/repos/{{ _repo }}/contents/{{ ee_definition_path }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ ee_git_token }}"
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          message: "{{ _message }}"
          content: "{{ _built_content | b64encode }}"
          sha: "{{ _write_guard }}"
          branch: "{{ ee_git_branch }}"
        status_code: [200, 201]
      register: _commit_gh
      no_log: true

    - name: Write the definition back to GitLab
      when:
        - _provider == 'gitlab'
        - _head_status | int == 200
        - not _moved_on | bool
        - not _unchanged | bool
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ _gl_files }}"
        method: PUT
        headers:
          PRIVATE-TOKEN: "{{ ee_git_token }}"
        body_format: json
        body:
          branch: "{{ ee_git_branch }}"
          commit_message: "{{ _message }}"
          content: "{{ _built_content | b64encode }}"
          encoding: base64
          last_commit_id: "{{ _write_guard }}"
        status_code: [200, 201]
      register: _commit_gl
      no_log: true

    - name: Work out what happened
      ansible.builtin.set_fact:
        _committed: >-
          {{ (_commit_gh is defined and _commit_gh is not skipped)
             or (_commit_gl is defined and _commit_gl is not skipped) }}

    - name: Name the outcome
      ansible.builtin.set_fact:
        _result: >-
          {{ 'committed' if _committed | bool
             else ('file_missing' if _head_status | int != 200
                   else ('changed_upstream' if _moved_on | bool else 'already_current')) }}

    # GitLab's files API answers a write with the path and branch only, so the
    # commit it created has to be read back.
    - name: Find the commit GitLab created
      when:
        - _provider == 'gitlab'
        - _committed | bool
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ _gl_files }}?ref={{ ee_git_branch }}"
        headers:
          PRIVATE-TOKEN: "{{ ee_git_token }}"
        status_code: [200]
      register: _gl_after
      no_log: true
      changed_when: false

    - name: Note the commit
      ansible.builtin.set_fact:
        _sha: >-
          {{ (_commit_gh.json.commit.sha | default(''))
             if _provider == 'github' and _committed | bool
             else ((_gl_after.json.last_commit_id | default(''))
                   if _committed | bool else '') }}

    - name: Publish the result
      ansible.builtin.set_stats:
        aggregate: false
        per_host: false
        data:
          ee_commit_result: "{{ _result }}"
          ee_commit_sha: "{{ _sha }}"
          ee_commit_path: "{{ ee_definition_path }}"

    - name: Say what happened
      ansible.builtin.debug:
        msg: >-
          {{ {
               'committed': "Wrote the agent's fix back to " ~ ee_definition_path
                            ~ " on " ~ ee_git_branch ~ " as " ~ _sha[:7],
               'already_current': ee_definition_path ~ ' already matches what was built; nothing to commit.',
               'changed_upstream': ee_definition_path ~ ' changed in the repository since this build started, so it was left alone.',
               'file_missing': ee_definition_path ~ ' is no longer in the repository, so there was nothing to update.'
             }[_result] }}
